#cloud-config
package_update: true
packages:
  - git
  - curl
  - docker.io

runcmd:
  - systemctl enable --now docker
  - git clone https://github.com/HarishV14/cloud-init-playground.git /opt/cloud-init-playground
  - docker build -t testpress-app:v1 /opt/cloud-init-playground/app
  - docker run -d --env-file /opt/testpress/app.env --name testpress-app --restart unless-stopped -p 8080:8080 testpress-app:v1

groups:
  - docker

users:
  - default
  - name: testpress
    gecos: Testpress Application User
    shell: /bin/bash
    groups:
      - docker

write_files:
  - path: /opt/testpress/app.env
    owner: root:root
    permissions: !!str 0644
    content: |
      APP_NAME=Testpress
      APP_PORT=8080
      APP_ENV=production
