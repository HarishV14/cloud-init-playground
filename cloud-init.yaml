#cloud-config
package_update: true
packages:
  - git
  - curl
  - docker.io

runcmd:
  - systemctl enable --now docker
  - test -d /opt/cloud-init-playground/.git || git clone https://github.com/HarishV14/cloud-init-playground.git /opt/cloud-init-playground
  - docker image inspect testpress-app:v1 >/dev/null 2>&1 || docker build -t testpress-app:v1 /opt/cloud-init-playground/app
  - docker container inspect testpress-app >/dev/null 2>&1 || docker run -d --env-file /opt/testpress/app.env --name testpress-app --restart unless-stopped -p 8080:8080 testpress-app:v1


  - install -m 0644 /opt/cloud-init-playground/monitoring/testpress-monitor.service /etc/systemd/system/testpress-monitor.service
  - systemctl daemon-reload
  - systemctl enable --now testpress-monitor.service

groups:
  - docker

users:
  - default
  - name: testpress
    gecos: Testpress Application User
    shell: /bin/bash
    groups:
      - docker

write_files:
  - path: /opt/testpress/app.env
    owner: root:root
    permissions: !!str 0644
    content: |
      APP_NAME=Testpress
      APP_PORT=8080
      APP_ENV=production
